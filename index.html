<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador TWRP · Nexus 5 (hammerhead)</title>
<style>
:root{--bg:#e6e8eb;--fg:#1c2127;--muted:#5d6670;--card:#fff;--line:#cdd2d8;--acc:#0a78b4;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f12;--fg:#e4e6e9;--muted:#8f98a2;--card:#191d22;--line:#2b3138;--acc:#3db2ee;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0f12;--fg:#e4e6e9;--muted:#8f98a2;--card:#191d22;--line:#2b3138;--acc:#3db2ee;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;-webkit-tap-highlight-color:transparent}
.top{width:100%;max-width:520px;padding:10px 14px 2px;display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.top h1{font-size:15px;margin:0;font-weight:650}
.top span{font-size:12px;color:var(--muted)}
.stage{display:flex;justify-content:center;padding:8px 0;width:100%}
.phone{--w:min(92vw,420px,calc((100vh - 180px) * .5018));width:var(--w);aspect-ratio:69.2/137.9;position:relative;border-radius:10.5%/5.3%;background:linear-gradient(160deg,#2b2b2e,#141415 38%,#0a0a0b);box-shadow:0 0 0 1.5px #3b3b3f,inset 0 0 0 2px #050505,0 16px 36px rgba(0,0,0,.35)}
@supports (height:100dvh){.phone{--w:min(92vw,420px,calc((100dvh - 180px) * .5018))}}
.spk{position:absolute;top:4.6%;left:50%;width:24%;height:.9%;transform:translateX(-50%);border-radius:99px;background:repeating-linear-gradient(90deg,#222 0 2px,#090909 2px 4px)}
.cam{position:absolute;top:4.15%;left:68%;width:3.4%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 40%,#33415c,#05070a 62%)}
.led{position:absolute;bottom:4.6%;left:50%;width:2.2%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:#151515}
.sb{position:absolute;width:1.7%;border:0;padding:0;background:#1f1f22;cursor:pointer;border-radius:2px}
.sb:active{filter:brightness(1.8)}
.sb.pw{right:-1.4%;top:22%;height:8%}
.sb.vu{left:-1.4%;top:19%;height:6.6%}
.sb.vd{left:-1.4%;top:25.8%;height:6.6%}
.screen{position:absolute;left:5.6%;right:5.6%;top:10.3%;height:79.4%;background:#000;overflow:hidden;container-type:inline-size;border-radius:3px}
body.bare .phone{--w:min(100vw,calc((100vh - 150px) * .5625));aspect-ratio:9/16;border-radius:0;background:none;box-shadow:none}
@supports (height:100dvh){body.bare .phone{--w:min(100vw,calc((100dvh - 150px) * .5625))}}
body.bare .screen{left:0;right:0;top:0;height:100%;border-radius:0}
body.bare .spk,body.bare .cam,body.bare .led,body.bare .sb{display:none}
.hw{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:0 10px}
.hw button{font:inherit;font-size:13px;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.hw button:active{background:var(--acc);color:#fff;border-color:var(--acc)}
.hw button:focus-visible,.tools button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tools{display:flex;gap:4px;margin-top:4px}
.tools button{font:inherit;font-size:12.5px;background:none;border:0;color:var(--acc);padding:6px 8px;cursor:pointer}
.notice{font-size:12.5px;line-height:1.4;color:var(--muted);max-width:420px;text-align:center;margin:2px 16px 14px;min-height:1.4em;transition:opacity .4s}

/* ===== Recovery (dentro de la pantalla) ===== */
.inner{position:absolute;inset:0;font-size:3.9cqw;line-height:1.3;font-family:Roboto,"Droid Sans","Segoe UI",system-ui,sans-serif;color:#e8e8e8;user-select:none;-webkit-user-select:none;
--t-bg:#141414;--t-head:#1b1b1b;--t-btn:#262626;--t-line:#333;--t-acc:#1fa0dd;--t-dim:#9a9a9a;--t-ok:#5fd16b;--t-err:#ff5a52}
.inner button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.inner button:focus-visible{outline:.12em solid var(--t-acc);outline-offset:.08em}
#ui{position:absolute;inset:0;display:none;flex-direction:column;background:var(--t-bg)}
.tw-head{display:flex;justify-content:space-between;align-items:flex-end;padding:.75em .85em .5em;background:var(--t-head);border-bottom:.14em solid var(--t-acc);flex:none}
.tw-name{font-weight:600;font-size:.86em;line-height:1.2}
.tw-ver{color:var(--t-acc);font-size:.78em}
.tw-r{text-align:right}
.tw-clock{font-size:1.15em;font-weight:500}
.tw-stat{font-size:.68em;color:var(--t-dim)}
.tw-mid{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.tw-title{padding:.5em .85em;font-size:1.02em;color:var(--t-acc);font-weight:600;border-bottom:1px solid #262626;flex:none}
.tw-page{flex:1;min-height:0;overflow:auto;padding:.65em .85em .85em;display:flex;flex-direction:column;gap:.5em}
.tw-page.fill{overflow:hidden}
.tw-page.main{padding:.75em}
.grid{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:.55em;flex:1}
.grid>:last-child:nth-child(odd){grid-column:span 2}
.mbtn{background:var(--t-btn);border:1px solid #303030;border-radius:.35em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.45em;padding:.5em;font-size:1em!important}
.mbtn .ico{width:2.3em;height:2.3em;color:var(--t-acc)}
.mbtn:active,.btn:active,.fb-item:active{background:var(--t-acc);color:#fff}
.mbtn:active .ico{color:#fff}
svg{display:block;width:100%;height:100%}
.row{display:flex;gap:.5em;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.5em}
.btn{background:#2b2b2b;border:1px solid #3b3b3b;padding:.72em .5em;border-radius:.3em;font-size:.88em!important;flex:1;line-height:1.15}
.btn:disabled{opacity:.4}
.info{margin:0;font-size:.92em}
.dim{color:var(--t-dim)}
.warn{margin:0;color:#ffc04d;font-size:.9em}
.warn.big{font-size:1.05em;text-align:center;margin:1.2em 0}
.kv{font-size:.88em;word-break:break-all}
.store{flex:1;font-size:.82em;color:var(--t-dim);align-self:center}
.chk{display:flex;align-items:center;gap:.7em;padding:.45em .15em;background:none;border:0;text-align:left;width:100%;flex:none}
.chk:disabled{opacity:.4}
.chk .box{width:1.2em;height:1.2em;border:.12em solid #8a8a8a;border-radius:.15em;flex:none;display:grid;place-items:center}
.chk.on .box{background:var(--t-acc);border-color:var(--t-acc)}
.chk.on .box::after{content:"";width:.32em;height:.62em;border:solid #fff;border-width:0 .14em .14em 0;transform:translateY(-.06em) rotate(45deg)}
.chk.radio .box{border-radius:50%}
.chk.radio.on .box{background:none}
.chk.radio.on .box::after{width:.55em;height:.55em;border:0;border-radius:50%;background:var(--t-acc);transform:none}
.lbl{font-size:.92em}
.lbl.small{font-size:.78em;word-break:break-all}
.namebtn{background:#202020;border:1px solid #333;border-radius:.3em;padding:.6em;text-align:left;font-size:.88em!important;flex:none}
.sw{position:relative;height:3.3em;background:#1d1d1d;border:1px solid #333;border-radius:.35em;margin-top:auto;flex:none;overflow:hidden}
.sw-fill{position:absolute;left:0;top:0;bottom:0;width:2.7em;background:rgba(31,160,221,.18)}
.sw-label{position:absolute;inset:0;display:grid;place-items:center;color:#c8c8c8;font-size:.9em;padding-left:4.6em;pointer-events:none}
.sw-thumb{position:absolute;left:.25em;top:.25em;bottom:.25em;width:4.6em;background:var(--t-acc);border-radius:.28em;display:grid;place-items:center;touch-action:none;cursor:grab;color:#fff}
.sw-thumb svg{width:1.6em;height:1.6em}
.fb{display:flex;flex-direction:column;gap:.3em}
.fb-path{color:var(--t-acc);font-size:.8em;word-break:break-all}
.fb-list{display:flex;flex-direction:column;border-top:1px solid #262626}
.fb-item{display:flex;align-items:center;gap:.6em;padding:.55em .25em;border:0;border-bottom:1px solid #242424;background:none;text-align:left;width:100%}
.fi{width:1.3em;height:1.3em;flex:none;color:var(--t-dim)}
.fb-item.dir .fi{color:#e6b84a}
.fb-item.up .fi{color:var(--t-acc)}
.fn{font-size:.86em;word-break:break-all}
.con{background:#0a0a0a;font-family:"Droid Sans Mono",ui-monospace,Menlo,Consolas,monospace;font-size:.64em;line-height:1.38;padding:.55em;overflow:auto;white-space:pre-wrap;word-break:break-word;color:#d6d6d6;user-select:text;-webkit-user-select:text}
.con .err{color:var(--t-err)}
.con .hl{color:var(--t-acc)}
.con .ok{color:var(--t-ok)}
.op-con{flex:1;min-height:0;display:flex;border:1px solid #262626;border-radius:.25em;overflow:hidden}
.op-con>.con{flex:1}
.op-status{font-size:.85em;color:var(--t-dim);text-align:center;flex:none;min-height:1.3em}
.op-res{font-weight:700;text-align:center;font-size:1.05em;flex:none}
.op-res.ok{color:var(--t-ok)}
.op-res.bad{color:var(--t-err)}
.pbar{height:.5em;background:#2a2a2a;border-radius:.25em;overflow:hidden;flex:none}
.pbar i{display:block;height:100%;width:0;background:var(--t-acc)}
.pbar.ind i{width:35%;animation:ind 1.2s ease-in-out infinite}
@keyframes ind{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
.tw-nav{display:flex;justify-content:space-around;align-items:center;background:#0e0e0e;border-top:1px solid #222;flex:none;height:3.3em}
.tw-nav button{background:none;border:0;width:3.4em;height:100%;display:grid;place-items:center;color:#ddd}
.tw-nav button span{width:1.5em;height:1.5em;display:block}
.tw-nav button:active{color:var(--t-acc)}
#conov{position:absolute;inset:0;background:#0a0a0a;display:flex;z-index:5}
#conov[hidden]{display:none}
#conov .con{flex:1}
.inrow{display:flex;gap:.5em;align-items:stretch}
.kbd,.term-in{flex:1;min-width:0;background:#0d0d0d;border:1px solid #444;border-radius:.25em;color:#fff;padding:.45em .55em;font-size:max(16px,1em);font-family:inherit;outline:none}
.kbd:focus,.term-in:focus{border-color:var(--t-acc)}
.err-line{color:var(--t-err);font-size:.85em;min-height:1.2em}
.term-out{flex:1;min-height:0;border:1px solid #262626;border-radius:.25em}
.term-row{display:flex;align-items:center;gap:.4em;flex:none}
.term-pr{font-family:ui-monospace,Menlo,monospace;font-size:.75em;color:var(--t-acc);white-space:nowrap}
.term-in{font-family:ui-monospace,Menlo,monospace}
.rng{width:100%;accent-color:var(--t-acc)}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;z-index:20}
.mbox{width:86%;max-height:86%;overflow:auto;background:#202020;border:1px solid #3a3a3a;border-radius:.4em;padding:.9em;display:flex;flex-direction:column;gap:.6em}
.mtitle{color:var(--t-acc);font-weight:600}
.mbody{font-size:.9em;display:flex;flex-direction:column;gap:.2em}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:.85em}
#ov{position:absolute;inset:0;z-index:30;display:none;background:#000}
#blank{position:absolute;inset:0;z-index:40;display:none;background:#000}
#dim{position:absolute;inset:0;z-index:50;background:#000;pointer-events:none;opacity:0}
.scr-off{position:absolute;inset:0;background:#000}
.logo-scr{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.logo-txt{font-size:2.1em;font-weight:300;letter-spacing:.05em}
.lock{position:absolute;bottom:9%;width:1.8em;height:1.8em;color:#fff}
.loopn{position:absolute;bottom:3.5%;font-size:.7em;color:#ff6b61}
.splash{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.sp-t{font-size:2.5em;font-weight:700;letter-spacing:.01em;color:#fff}
.sp-s{font-size:1.05em;color:#9a9a9a}
.sp-v{color:var(--t-acc);margin-top:.4em;font-size:.9em}
.sp-bar{width:50%;height:.25em;background:#222;margin-top:1.6em;overflow:hidden;border-radius:9px}
.sp-bar i{display:block;height:100%;width:35%;background:var(--t-acc);animation:ind 1.1s ease-in-out infinite}
.ba{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5em;color:#eee}
.ba-dots{display:flex;gap:.6em}
.ba-dots i{width:.8em;height:.8em;border-radius:50%;background:#e6e6e6;animation:bob 1.2s ease-in-out infinite}
.ba-dots i:nth-child(2){animation-delay:.15s}.ba-dots i:nth-child(3){animation-delay:.3s}.ba-dots i:nth-child(4){animation-delay:.45s}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(-.9em);opacity:1}}
.ba-word{font-size:1.35em;font-weight:300;letter-spacing:.14em}
.ba-lin-mark{width:4.6em;height:4.6em;position:relative;animation:spin 1.6s linear infinite}
.ba-lin-mark i{position:absolute;inset:0;border-radius:50%;border:.18em solid #2f2f2f}
.ba-lin-mark b{position:absolute;top:-.26em;left:50%;width:.7em;height:.7em;margin-left:-.35em;border-radius:50%;background:#1aa59f}
@keyframes spin{to{transform:rotate(360deg)}}
.ba-loop{color:#ff6b61;font-size:.75em}
.and{position:absolute;inset:0;background:radial-gradient(120% 80% at 20% 10%,#2c5d8f 0,#173252 45%,#0b1626 100%);color:#fff;display:flex;flex-direction:column}
.and.lin{background:radial-gradient(120% 80% at 80% 0%,#1f8a88 0,#11474f 45%,#081c22 100%)}
.and-sb{display:flex;justify-content:space-between;font-size:.72em;padding:.45em .8em;opacity:.9}
.and-lock,.and-setup{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 1em}
.and-clock{font-size:4em;font-weight:200;line-height:1}
.and-date{font-size:.95em;opacity:.85;margin-top:.4em}
.and-big{font-size:2.4em;font-weight:300}
.and-card{margin:.8em;background:rgba(0,0,0,.38);border-radius:.6em;padding:.8em;font-size:.82em;display:flex;flex-direction:column;gap:.25em}
.and-os{font-weight:600;font-size:1.1em}
.and-btns{display:flex;flex-direction:column;gap:.4em;margin-top:.5em}
.abtn{font-family:ui-monospace,Menlo,monospace!important;font-size:.92em!important;padding:.55em .7em;border-radius:.4em;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);text-align:left}
.abtn:active{background:rgba(255,255,255,.25)}
.fbs{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;font-family:"Courier New",ui-monospace,monospace;color:#fff;padding:6% 4% 4%}
.fb-opt{font-size:2em!important;font-weight:700;background:none;border:0;text-align:center;padding:.2em;letter-spacing:.02em}
.fb-mid{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;color:#777;font-size:.78em;padding:0 8%}
.fb-info{font-size:.7em;line-height:1.4}
.fb-info .r{color:#ff3b30}
@media (prefers-reduced-motion:reduce){.inner *{animation-duration:3s!important}}
</style>
</head>
<body>
<div class="top"><h1>Simulador TWRP</h1><span>Nexus 5 (hammerhead) · TWRP 3.3.1-0</span></div>
<div class="stage">
  <div class="phone" id="phone">
    <div class="spk"></div><div class="cam"></div><div class="led"></div>
    <button class="sb vu" data-hw="volup" aria-label="Subir volumen"></button>
    <button class="sb vd" data-hw="voldown" aria-label="Bajar volumen"></button>
    <button class="sb pw" data-hw="power" aria-label="Botón de encendido"></button>
    <div class="screen" id="screen">
      <div class="inner" id="inner">
        <div id="ui">
          <div class="tw-head">
            <div><div class="tw-name">Team Win Recovery Project</div><div class="tw-ver">3.3.1-0</div></div>
            <div class="tw-r"><div class="tw-clock" id="clock">--:--</div><div class="tw-stat"><span id="cpu">CPU 36°C</span> &nbsp;<span id="bat">87%</span></div></div>
          </div>
          <div class="tw-mid">
            <div class="tw-title" id="title"></div>
            <div class="tw-page" id="page"></div>
            <div id="conov" hidden></div>
          </div>
          <div class="tw-nav">
            <button id="nav-back" aria-label="Atrás"><span data-ico="back"></span></button>
            <button id="nav-home" aria-label="Inicio"><span data-ico="home"></span></button>
            <button id="nav-con" aria-label="Consola"><span data-ico="console"></span></button>
          </div>
        </div>
        <div id="ov"></div>
        <div id="blank"></div>
        <div id="dim"></div>
      </div>
    </div>
  </div>
</div>
<div class="hw">
  <button data-hw="volup">Vol +</button>
  <button data-hw="voldown">Vol −</button>
  <button data-hw="power">Power</button>
  <button data-hw="combo">Power + Vol −</button>
</div>
<div class="tools"><button id="bare">Pantalla completa</button><button id="reset">Reiniciar simulación</button></div>
<p class="notice" id="notice" aria-live="polite"></p>

<script>

function dfText(){const rows=[['Filesystem','1K-blocks','Used','Available','Use%','Mounted on']];

 add('tmpfs',925,.1,'/dev');if(S.mounted.system)add('/dev/block/mmcblk0p25',1007,partMB('system'),'/system');if(S.mounted.cache)add('/dev/block/mmcblk0p27',677,14,'/cache');if(S.mounted.data)add('/dev/block/mmcblk0p28',DATA_TOTAL,usedMB(),'/data');

function runCmd(line){const a=line.trim().split(/\s+/).filter(Boolean);if(!a.length)return '';const c=a[0],args=a.slice(1),flags=args.filter(x=>x.startsWith('-')).join(''),pos=args.filter(x=>!x.startsWith('-'));
 const R=p=>resolve(term.cwd,p);
 switch(c){
  case 'help':return 'Commands: ls [-l] [dir], cd <dir>, pwd, cat <file>, echo, getprop [key], df, mount, umount <dir>, rm [-r] <path>, mkdir <dir>, uname [-a], whoami, id, date, reboot [recovery|bootloader|-p], clear, exit';
  case 'pwd':return term.cwd;
  case 'cd':{const p=R(pos[0]||'/'),n=vget(p);if(!n)return `cd: ${pos[0]}: No such file or directory`;if(n.t!=='d')return `cd: ${pos[0]}: Not a directory`;term.cwd=p;return '';}
  case 'ls':{const p=R(pos[0]||'.'),n=vget(p);if(!n)return `ls: ${pos[0]}: No such file or directory`;
   const ent=n.t==='d'?Object.keys(n.c).sort().map(k=>[k,n.c[k]]):[[baseOf(p),n]];
   if(flags.includes('l'))return ent.map(([k,x])=>(x.t==='d'?'drwxrwx--x':'-rw-rw----')+' root     sdcard_rw '+String(x.t==='d'?4096:x.s).padStart(10)+' 2019-01-10 21:14 '+k).join('\n');

  case 'uname':return flags.includes('a')?'Linux localhost 3.4.0-gd59db4e #1 SMP PREEMPT Wed Oct 7 18:50:38 UTC 2015 armv7l GNU/Linux':'Linux';

  case 'mkdir':{if(!pos[0])return 'usage: mkdir <dir>';const p=R(pos[0]),[pn,nm]=vparent(p);if(!pn||pn.t!=='d')return `mkdir: ${pos[0]}: No such file or directory`;if(pn.c[nm])return `mkdir: ${pos[0]}: File exists`;pn.c[nm]=D();save();return '';}

P.term=()=>{const out=h('div',{class:'con term-out'});out.textContent=term.buf;

  h('div',{class:'and-card'},h('div',{class:'and-os'},`${o.name} (Android ${o.android})`),h('div',{},'Build: '+o.build),h('div',{},'Root: '+(S.magisk?'Magisk':'no')),h('div',{},'Google Apps: '+(S.gapps?'sí':'no')),

async function bootSystem(){const t=++bootToken;setMode('boot');showOv(logoScreen());await sleep(1800);if(t!==bootToken)return;
 if(S.bootKind==='twrp'){toast('La partición boot contiene una imagen de TWRP: el teléfono arranca en recovery en vez de en el sistema.');return startRecovery(t);}

  if(t!==bootToken)return;if(kernelOk&&dataOk)break;n++;
  toast(!kernelOk?'Bootloop: el boot.img no corresponde a la ROM instalada. Flashea el boot correcto o reinstala la ROM. Sal con Power + Vol −.':'Bootloop: los datos son de otra ROM (dirty flash). Entra en recovery y haz Wipe > Factory Reset. Sal con Power + Vol −.');
